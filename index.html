<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memoaris</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f7fd;color:#24384d;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif}

header{
  background:radial-gradient(
    ellipse at top left,
    #d9e9ff 0%,
    #f3f7fd 65%
  );
  padding:24px 20px 16px;
  text-align:center;
  border-radius:0 0 28px 28px;
}

header h1{font-size:34px;margin:12px 0}
header p{
  color:#173F85;
  font-size:19px;
  font-weight:700;
  letter-spacing:0.3px;
  text-align:center;
  margin:12px 0;
}
main{padding:24px 20px;max-width:650px;margin:auto}
.card{display:flex;align-items:center;gap:18px;background:white;border:0;border-radius:22px;padding:23px;margin-bottom:16px;box-shadow:0 6px 18px #244b7012;width:100%;text-align:left;color:inherit;cursor:pointer}
.symbol{font-size:31px}
.card h2{margin:0 0 5px;font-size:20px}
.card p{margin:0;color:#718294;font-size:14px}
button{font:inherit}
.action{background:#3289ca;color:white;border:0;border-radius:14px;padding:13px 17px;margin:5px 5px 12px 0;cursor:pointer}
.back{background:transparent;color:#286ca8;border:0;padding:12px 0;font-weight:600}
input,textarea{width:100%;padding:14px;border:1px solid #ccd9e7;border-radius:12px;font:inherit;margin:8px 0 14px;background:white}
textarea{min-height:140px;resize:vertical}
.folder{background:white;border-radius:16px;padding:17px;margin:10px 0;display:flex;justify-content:space-between;align-items:center;gap:10px}
.folder button{border:0;background:#eaf4ff;border-radius:10px;padding:10px;color:#246aab}
.foldername{flex:1;text-align:left;background:none!important;color:#24384d!important;font-weight:600}
.note{background:white;border-radius:15px;padding:17px;margin:12px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.muted{color:#718294;font-size:14px}
[hidden]{display:none!important}

#mediaPreview {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
  width: 100%;
  margin-top: 20px;
}

#mediaPreview img,
#mediaPreview video {
  width: 100% !important;
  max-width: none !important;
  height: auto;
  aspect-ratio: 1 / 1;
  object-fit: cover;
  border-radius: 14px !important;
  margin-top: 0 !important;
  cursor: pointer;
}

/* Memoaris: moderne knoppen */
#mediaButtons {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin: 20px 0;
}

#mediaButtons button {
  flex: 1 1 180px;
  min-height: 54px;
  padding: 14px 18px;
  border: none;
  border-radius: 16px;
  background: linear-gradient(135deg, #3289ca, #1764b2);
  color: white;
  font-size: 15px;
  font-weight: 600;
  box-shadow: 0 5px 14px rgba(30, 100, 180, 0.15);
  cursor: pointer;
}

/* Meer ruimte rond de mappen */
.folder {
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 100px;
  padding: 16px;
  margin-bottom: 12px;
  border-radius: 18px;
  background: white;
}

.foldername {
  flex: 1;
  min-width: 0;
  text-align: left;
}

.folder button {
  flex-shrink: 0;
}

/* Privéruimte */
.waarschuwing {
  background: #fff4e5;
  color: #8a4b00;
  border-radius: 12px;
  padding: 12px 14px;
  font-size: 14px;
  line-height: 1.5;
}

.notitiekaart {
  background: white;
  padding: 18px;
  border-radius: 16px;
  margin: 12px 0;
  overflow-wrap: anywhere;
}

.mediaknoppen {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin: 12px 0 20px;
}

.mediaknoppen button {
  flex: 1 1 180px;
  min-height: 54px;
  padding: 14px 18px;
  border: none;
  border-radius: 16px;
  background: linear-gradient(135deg, #3289ca, #1764b2);
  color: white;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
}

.privegalerij {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
  margin-bottom: 24px;
}

.privegalerij img,
.privegalerij video {
  display: block;
  width: 100%;
  aspect-ratio: 1 / 1;
  object-fit: cover;
  border-radius: 14px;
  cursor: pointer;
}

.notitiekaart button {
  border: 0;
  background: #eaf4ff;
  color: #246aab;
  border-radius: 10px;
  padding: 8px 12px;
  margin: 10px 8px 0 0;
}
</style>
</head>
<body>
<header>
<img src="A130CFB8-EE44-4D1A-86EA-3F849F279DCC.png"
     alt="Memoaris logo"
     style="display:block;width:100%;max-width:340px;height:auto;margin:0 auto 12px;border-radius:12px;">
<p>Bewaar de momenten die tellen.</p>
</header>

<main>
<section id="home">
<button class="card" onclick="show('albums')">
<span class="symbol">🖼️</span>
<span><h2>Mijn Memoaris</h2><p>Foto's, video's en herinneringen</p></span>
</button>
<button class="card" onclick="show('notes')">
<span class="symbol">📝</span>
<span><h2>Notes</h2><p>Schrijf jouw persoonlijke verhalen</p></span>
</button>
<button class="card" onclick="show('private')">
<span class="symbol">🔒</span>
<span><h2>Private</h2><p>Jouw persoonlijke privéruimte</p></span>
</button>
<button class="card" onclick="show('prullenbak')">
  <span class="symbol">🗑️</span>
  <span>
    <h2>Prullenbak</h2>
    <p>Bekijk en herstel verwijderde herinneringen.</p>
  </span>
</button>
</section>

<section id="albums" hidden>
<button class="back" onclick="goBack()">← Terug</button>
<h2 id="folderTitle">📁 Mijn Memoaris</h2>
<button class="action" onclick="newFolder()">+ Nieuwe map</button>
<div id="folderList"></div>

<button class="action" onclick="maakBackup()">📥 Back-up maken</button>
<button class="action" onclick="document.getElementById('herstelBackupInput').click()">📥 Back-up herstellen</button>

<input
  id="herstelBackupInput"
  type="file"
  accept=".json,application/json"
  hidden
  onchange="herstelBackupVeilig(this.files[0]); this.value='';"
>

<p class="muted">Maak je eigen mappen en submappen.</p>

<div id="mediaButtons">
  <button onclick="document.getElementById('galleryInput').click()">
    🖼️ Foto's en video's toevoegen
  </button>
  <button onclick="document.getElementById('cameraInput').click()">
    📷 Camera openen
  </button>
  <input id="galleryInput" type="file" accept="image/*,video/*" multiple hidden>
  <input id="cameraInput" type="file" accept="image/*" capture="environment" hidden>
</div>
<div id="mediaPreview"></div>
</section>

<section id="notes" hidden>
<button class="back" onclick="show('home')">← Terug</button>
<h2>📝 Mijn Notes</h2>
<input id="noteTitle" placeholder="Titel van je notitie">
<textarea id="noteText" placeholder="Schrijf hier je herinnering..."></textarea>
<button class="action" onclick="saveNote()">Notitie bewaren</button>
<div id="noteList"></div>
</section>

<section id="private" hidden>
<button class="back" onclick="show('home')">← Terug</button>
<h2>🔒 Private</h2>
<div id="privateInhoud"></div>
</section>

<section id="prullenbak" hidden>
  <button class="back" onclick="show('home')">← Terug</button>
  <h2>🗑️ Prullenbak</h2>
  <p class="muted">
    Verwijderde herinneringen blijven maximaal 30 dagen bewaard.
    Gratis gebruikers kunnen ze binnen 7 dagen herstellen.
    Met Premium kan dat tot 30 dagen.
  </p>
  <div id="prullenbakLijst"></div>
</section>
</main>

<script>
/* ===================== Instellingen ===================== */
const KEY = 'memoaris-demo-v2';
const DB_NAAM = 'MemoarisMedia';
// Versie 3 repareert databases die eerder zonder opslag 'fotos' zijn aangemaakt.
// Versie 4 voegt de versleutelde opslag 'privefotos' toe.
const DB_VERSIE = 4;
const DERTIG_DAGEN = 30 * 24 * 60 * 60 * 1000;

function nieuwId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2);
}

/* ===================== Mappen en notities (localStorage) ===================== */
let data = { folders: [], notes: [] };
try {
  const saved = JSON.parse(localStorage.getItem(KEY));
  if (saved && Array.isArray(saved.folders) && Array.isArray(saved.notes)) data = saved;
} catch (e) {}

// Oude notities zonder id krijgen er alsnog een.
let notitiesGemigreerd = false;
data.notes.forEach(note => {
  if (!note.id) { note.id = nieuwId(); notitiesGemigreerd = true; }
});
if (notitiesGemigreerd) persist();

let path = [];

function persist() {
  try { localStorage.setItem(KEY, JSON.stringify(data)); }
  catch (e) { alert('Opslaan lukt niet in deze browser.'); }
}

/* ===================== Database (IndexedDB) ===================== */
// Eén plek waar de database geopend wordt, zodat de opslag altijd bestaat.
function openDB() {
  return new Promise((resolve, reject) => {
    const verzoek = indexedDB.open(DB_NAAM, DB_VERSIE);
    verzoek.onupgradeneeded = () => {
      const db = verzoek.result;
      if (!db.objectStoreNames.contains('fotos')) {
        db.createObjectStore('fotos', { keyPath: 'id' });
      }
      if (!db.objectStoreNames.contains('privefotos')) {
        db.createObjectStore('privefotos', { keyPath: 'id' });
      }
    };
    verzoek.onsuccess = () => resolve(verzoek.result);
    verzoek.onerror = () => reject(verzoek.error);
  });
}

// Voert één handeling uit op een opslag en wacht tot die echt is opgeslagen.
async function metStore(naam, modus, werk) {
  const db = await openDB();
  try {
    return await new Promise((resolve, reject) => {
      const tx = db.transaction(naam, modus);
      let resultaat;
      const verzoek = werk(tx.objectStore(naam));
      if (verzoek) verzoek.onsuccess = () => { resultaat = verzoek.result; };
      tx.oncomplete = () => resolve(resultaat);
      tx.onerror = () => reject(tx.error);
      tx.onabort = () => reject(tx.error);
    });
  } finally {
    db.close();
  }
}

async function alleMedia() {
  const db = await openDB();
  try {
    return await new Promise((resolve, reject) => {
      const ophalen = db.transaction('fotos', 'readonly').objectStore('fotos').getAll();
      ophalen.onsuccess = () => resolve(ophalen.result);
      ophalen.onerror = () => reject(ophalen.error);
    });
  } finally {
    db.close();
  }
}

async function slaMediaItemOp(item) {
  const db = await openDB();
  try {
    await new Promise((resolve, reject) => {
      const tx = db.transaction('fotos', 'readwrite');
      tx.objectStore('fotos').put(item);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
      tx.onabort = () => reject(tx.error);
    });
  } finally {
    db.close();
  }
}

async function verwijderMediaDefinitief(ids) {
  if (!ids.length) return;
  const db = await openDB();
  try {
    await new Promise((resolve, reject) => {
      const tx = db.transaction('fotos', 'readwrite');
      const opslag = tx.objectStore('fotos');
      ids.forEach(id => opslag.delete(id));
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
      tx.onabort = () => reject(tx.error);
    });
  } finally {
    db.close();
  }
}

// Verwijdert herinneringen die langer dan 30 dagen in de prullenbak liggen.
async function ruimPrullenbakOp() {
  const media = await alleMedia();
  const verlopen = media
    .filter(foto =>
      typeof foto.verwijderdOp === 'number' &&
      Date.now() - foto.verwijderdOp >= DERTIG_DAGEN)
    .map(foto => foto.id);
  await verwijderMediaDefinitief(verlopen);
  return verlopen.length;
}

/* ===================== Geheugenbeheer voor foto-URL's ===================== */
let actieveUrls = [];
function maakUrl(blob) {
  const url = URL.createObjectURL(blob);
  actieveUrls.push(url);
  return url;
}
function ruimUrlsOp() {
  actieveUrls.forEach(url => URL.revokeObjectURL(url));
  actieveUrls = [];
}

/* ===================== Navigatie ===================== */
function show(page) {
  // Wie de privéruimte verlaat, vergrendelt hem meteen.
  if (page !== 'private') vergrendelPrivate();

  document.querySelectorAll('main section').forEach(s => s.hidden = true);
  document.getElementById(page).hidden = false;
  if (page === 'albums') renderFolders();
  if (page === 'notes') renderNotes();
  if (page === 'private') renderPrivate();
  if (page === 'prullenbak') laadPrullenbak();
  window.scrollTo(0, 0);
}

function goBack() {
  if (path.length) { path.pop(); renderFolders(); }
  else show('home');
}

/* ===================== Prullenbak ===================== */
async function laadPrullenbak() {
  const lijst = document.getElementById('prullenbakLijst');

  let media;
  try {
    await ruimPrullenbakOp();
    media = await alleMedia();
  } catch (fout) {
    console.error(fout);
    lijst.textContent = 'Prullenbak laden mislukt.';
    return;
  }

  lijst.replaceChildren();
  ruimUrlsOp();

  const verwijderd = media.filter(foto => foto.verwijderdOp);
  if (verwijderd.length === 0) {
    lijst.textContent = 'Je prullenbak is leeg.';
    return;
  }

  verwijderd.forEach(foto => {
    const dagen = Math.floor((Date.now() - foto.verwijderdOp) / 86400000);
    const kanHerstellen = dagen >= 0 && dagen < 7;

    const regel = document.createElement('div');
    regel.style.cssText = `
      background: white;
      border-radius: 18px;
      padding: 16px;
      margin: 16px 0;
      box-shadow: 0 6px 20px rgba(30,60,100,0.08);
    `;

    const beschrijving = document.createElement('p');
    beschrijving.textContent = kanHerstellen
      ? '🗑️ Nog ' + Math.max(0, 30 - dagen) + ' dagen bewaard'
      : '🔒 Premium nodig om te herstellen';
    beschrijving.style.cssText = `
      margin: 12px 0;
      color: #34445c;
      font-size: 15px;
      line-height: 1.5;
    `;
    regel.append(beschrijving);

    if (kanHerstellen && foto.bestand) {
      const miniatuur = document.createElement(
        foto.bestand.type.startsWith('video/') ? 'video' : 'img'
      );
      miniatuur.src = maakUrl(foto.bestand);
      miniatuur.style.cssText = `
        width: 110px;
        height: 110px;
        object-fit: cover;
        border-radius: 12px;
        display: block;
        margin-bottom: 8px;
      `;
      if (miniatuur.tagName === 'VIDEO') {
        miniatuur.muted = true;
        miniatuur.playsInline = true;
        miniatuur.preload = 'metadata';
      }
      regel.prepend(miniatuur);

      const herstelKnop = document.createElement('button');
      herstelKnop.textContent = '♻️ Herstellen';
      herstelKnop.style.cssText = `
        background: #287fc3;
        color: white;
        border: none;
        border-radius: 12px;
        padding: 12px 18px;
        font-size: 15px;
        font-weight: bold;
        margin-top: 12px;
        cursor: pointer;
      `;
      herstelKnop.onclick = async () => {
        if (!confirm('Wil je deze herinnering herstellen?')) return;
        herstelKnop.disabled = true;
        try {
          const hersteldeFoto = { ...foto };
          delete hersteldeFoto.verwijderdOp;
          await slaMediaItemOp(hersteldeFoto);
          alert('Herinnering hersteld!');
          laadPrullenbak();
        } catch (fout) {
          console.error(fout);
          herstelKnop.disabled = false;
          alert('Herstellen is niet gelukt.');
        }
      };
      regel.append(herstelKnop);
    }

    lijst.append(regel);
  });
}

/* ===================== Mappen ===================== */
function currentFolders() {
  let folders = data.folders;
  for (const id of path) {
    const found = folders.find(f => f.id === id);
    if (!found) { path = []; return data.folders; }
    folders = found.children;
  }
  return folders;
}

function currentFolderName() {
  let folders = data.folders, name = '';
  for (const id of path) {
    const folder = folders.find(f => f.id === id);
    if (!folder) break;
    name = folder.name;
    folders = folder.children;
  }
  return name;
}

function alleMappen(folders = data.folders, prefix = '') {
  let lijst = [];
  for (const folder of folders) {
    const naam = prefix + folder.name;
    lijst.push({ id: folder.id, naam });
    if (folder.children) {
      lijst.push(...alleMappen(folder.children, naam + ' / '));
    }
  }
  return lijst;
}

function renderFolders() {
  const list = document.getElementById('folderList');
  list.replaceChildren();
  document.getElementById('folderTitle').textContent =
    path.length ? '📁 ' + (currentFolderName() || 'Map') : '📁 Mijn Memoaris';

  currentFolders().forEach(folder => {
    const row = document.createElement('div');
    row.className = 'folder';

    const open = document.createElement('button');
    open.className = 'foldername';
    open.textContent = '📁 ' + folder.name;
    if (folder.cover) {
      open.style.backgroundImage = `url("${folder.cover}")`;
      open.style.backgroundSize = 'cover';
      open.style.backgroundPosition = 'center';
      open.style.color = 'white';
      open.style.minHeight = '120px';
      open.style.textShadow = '0 1px 5px black';
    }
    open.onclick = () => { path.push(folder.id); renderFolders(); };

    const rename = document.createElement('button');
    rename.textContent = '✏️';
    rename.setAttribute('aria-label', 'Map hernoemen');
    rename.onclick = () => {
      const name = prompt('Nieuwe mapnaam:', folder.name);
      if (name && name.trim()) { folder.name = name.trim(); persist(); renderFolders(); }
    };

    const omslagKnop = document.createElement('button');
    omslagKnop.textContent = '🖼️';
    omslagKnop.title = 'Omslagfoto kiezen';
    omslagKnop.onclick = () => {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'image/*';
      input.onchange = () => {
        const bestand = input.files[0];
        if (!bestand) return;
        const lezer = new FileReader();
        lezer.onload = () => {
          folder.cover = lezer.result;
          persist();
          renderFolders();
        };
        lezer.readAsDataURL(bestand);
      };
      input.click();
    };

    const verwijderMapKnop = document.createElement('button');
    verwijderMapKnop.textContent = '🗑️';
    verwijderMapKnop.title = 'Map verwijderen';
    verwijderMapKnop.onclick = async () => {
      if (folder.children?.length > 0) {
        alert('Deze map bevat submappen. Verwijder die eerst.');
        return;
      }

      let media;
      try {
        media = await alleMedia();
      } catch (fout) {
        console.error(fout);
        alert('Controle mislukt. De map is niet verwijderd.');
        return;
      }

      if (media.some(foto => foto.folderId === folder.id)) {
        alert('Deze map bevat foto’s of video’s (ook in de prullenbak). Verplaats of verwijder die eerst.');
        return;
      }

      if (!confirm('Weet je zeker dat je de lege map "' + folder.name + '" wilt verwijderen?')) return;

      const mappen = currentFolders();
      const index = mappen.findIndex(map => map.id === folder.id);
      if (index === -1) return;

      mappen.splice(index, 1);
      persist();
      renderFolders();
    };

    row.append(open, rename, omslagKnop, verwijderMapKnop);
    list.append(row);
  });

  laadFotos();
}

function newFolder() {
  const name = prompt('Hoe wil je de map noemen?');
  if (!name || !name.trim()) return;
  currentFolders().push({ id: nieuwId(), name: name.trim(), children: [] });
  persist();
  renderFolders();
}

/* ===================== Notities ===================== */
function saveNote() {
  const title = document.getElementById('noteTitle').value.trim();
  const body = document.getElementById('noteText').value.trim();
  if (!title && !body) { alert('Schrijf eerst iets.'); return; }

  data.notes.unshift({
    id: nieuwId(),
    title: title || 'Zonder titel',
    body: body,
    date: new Date().toLocaleDateString('nl-NL')
  });
  persist();
  document.getElementById('noteTitle').value = '';
  document.getElementById('noteText').value = '';
  renderNotes();
}

function renderNotes() {
  const lijst = document.getElementById('noteList');
  lijst.replaceChildren();

  data.notes.forEach(note => {
    const div = document.createElement('div');
    div.style.cssText = 'background:white;padding:18px;border-radius:16px;margin:12px 0;';

    const heading = document.createElement('h3');
    heading.textContent = note.title;

    const date = document.createElement('p');
    date.className = 'muted';
    date.textContent = note.date || '';

    const body = document.createElement('div');
    body.textContent = note.body || '';
    body.style.whiteSpace = 'pre-wrap';

    const bewerken = document.createElement('button');
    bewerken.textContent = '✏️ Bewerken';
    bewerken.onclick = () => {
      const titel = prompt('Nieuwe titel:', note.title);
      if (titel === null) return;
      const tekst = prompt('Nieuwe tekst:', note.body || '');
      if (tekst === null) return;
      note.title = titel.trim() || 'Zonder titel';
      note.body = tekst;
      persist();
      renderNotes();
    };

    const verwijderen = document.createElement('button');
    verwijderen.textContent = '🗑️ Verwijderen';
    verwijderen.onclick = () => {
      if (!confirm('Weet je zeker dat je deze notitie wilt verwijderen?')) return;
      data.notes = data.notes.filter(n => n.id !== note.id);
      persist();
      renderNotes();
    };

    div.append(heading, date, body, bewerken, verwijderen);
    lijst.append(div);
  });
}

/* ===================== Foto's en video's ===================== */
function bewaarMedia(bestand) {
  const folderId = path.length ? path[path.length - 1] : 'home';
  return slaMediaItemOp({
    id: crypto.randomUUID(),
    folderId: folderId,
    bestand: bestand,
    datum: new Date().toISOString()
  });
}

async function toonMedia(event) {
  const bestanden = Array.from(event.target.files || []).filter(b =>
    b.type.startsWith('image/') || b.type.startsWith('video/'));
  event.target.value = '';

  let mislukt = 0;
  for (const bestand of bestanden) {
    try {
      await bewaarMedia(bestand);
    } catch (fout) {
      console.error('Opslaan mislukt:', fout);
      mislukt++;
    }
  }

  if (mislukt) alert(mislukt + ' bestand(en) konden niet worden opgeslagen.');
  laadFotos();
}

document.getElementById('galleryInput').addEventListener('change', toonMedia);
document.getElementById('cameraInput').addEventListener('change', toonMedia);

let laadBeurt = 0;

async function laadFotos() {
  const beurt = ++laadBeurt;
  const preview = document.getElementById('mediaPreview');

  let media;
  try {
    media = await alleMedia();
  } catch (fout) {
    console.error(fout);
    alert('Opgeslagen foto’s konden niet worden geladen.');
    return;
  }

  // Een nieuwere laadactie is al bezig: deze niet meer tonen.
  if (beurt !== laadBeurt) return;

  preview.replaceChildren();
  ruimUrlsOp();

  const huidigeMap = path.length ? path[path.length - 1] : 'home';

  media
    .filter(foto => foto.folderId === huidigeMap && !foto.verwijderdOp)
    .forEach(foto => {
      const element = document.createElement(
        foto.bestand.type.startsWith('video/') ? 'video' : 'img'
      );
      element.src = maakUrl(foto.bestand);

      if (element.tagName === 'VIDEO') {
        element.controls = true;
      }

      if (element.tagName === 'IMG') {
        element.alt = 'Herinnering';
        element.onclick = () => openViewer(foto, element.src);
      }

      preview.appendChild(element);
    });
}

/* ===================== Back-up maken ===================== */
async function maakBackup() {
  try {
    const fotos = await alleMedia();

    const totaleGrootte = fotos.reduce(
      (totaal, foto) => totaal + (foto.bestand?.size || 0), 0);

    if (totaleGrootte > 20 * 1024 * 1024) {
      alert('Deze back-up is te groot voor de testversie. Er is niets veranderd.');
      return;
    }

    const media = [];
    for (const foto of fotos) {
      const inhoud = await new Promise((resolve, reject) => {
        const lezer = new FileReader();
        lezer.onload = () => resolve(lezer.result);
        lezer.onerror = () => reject(lezer.error);
        lezer.readAsDataURL(foto.bestand);
      });

      const { bestand, ...gegevens } = foto;
      media.push({
        ...gegevens,
        bestandsnaam: bestand.name || 'herinnering',
        bestandstype: bestand.type,
        inhoud
      });
    }

    const backup = {
      versie: 1,
      gemaaktOp: new Date().toISOString(),
      mappenEnNotities: data,
      media
    };

    const blob = new Blob([JSON.stringify(backup)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = 'memoaris-backup-' + new Date().toISOString().slice(0, 10) + '.json';
    document.body.append(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);

    alert('Back-updownload gestart. Controleer of het bestand is opgeslagen.');
  } catch (fout) {
    console.error('Back-up mislukt:', fout);
    alert('Back-up maken mislukt. Er is niets verwijderd.');
  }
}

/* ===================== Back-up herstellen ===================== */
async function leesBackupVoorHerstel(bestand) {
  if (!bestand) throw new Error('Geen bestand gekozen.');
  if (bestand.size > 30 * 1024 * 1024) throw new Error('Back-upbestand is te groot.');

  const backup = JSON.parse(await bestand.text());

  if (
    backup.versie !== 1 ||
    !backup.mappenEnNotities ||
    !Array.isArray(backup.mappenEnNotities.folders) ||
    !Array.isArray(backup.mappenEnNotities.notes) ||
    !Array.isArray(backup.media)
  ) {
    throw new Error('Ongeldige Memoaris-back-up.');
  }

  if (!backup.media.every(item =>
    item &&
    typeof item.id === 'string' &&
    typeof item.inhoud === 'string' &&
    item.inhoud.startsWith('data:')
  )) {
    throw new Error('De back-up bevat ongeldige media.');
  }

  return backup;
}

function controleerHerstelKoppelingen(backup) {
  const ids = new Set(['home']);

  function verzamel(mappen) {
    for (const map of mappen) {
      if (!map || typeof map.id !== 'string') {
        throw new Error('Ongeldige map in back-up.');
      }
      ids.add(map.id);
      if (Array.isArray(map.children)) verzamel(map.children);
    }
  }

  verzamel(data.folders);
  verzamel(backup.mappenEnNotities.folders);

  const ontbrekend = backup.media.filter(item => !ids.has(item.folderId));
  return { ontbrekend: ontbrekend.length };
}

async function herstelMediaBestand(item) {
  if (!item || typeof item.inhoud !== 'string') {
    throw new Error('Ongeldig mediabestand.');
  }

  const response = await fetch(item.inhoud);
  if (!response.ok) throw new Error('Mediabestand kan niet gelezen worden.');

  const blob = await response.blob();
  if (blob.size === 0) throw new Error('Mediabestand is leeg.');

  return new File([blob], item.bestandsnaam || 'herinnering', {
    type: item.bestandstype || blob.type,
    lastModified: Date.now()
  });
}

// Voegt een hersteld bestand alleen toe als het nog niet bestaat.
async function slaHersteldMediaOp(item, bestand) {
  const db = await openDB();
  try {
    return await new Promise((resolve, reject) => {
      const tx = db.transaction('fotos', 'readwrite');
      const store = tx.objectStore('fotos');
      let toegevoegd = false;

      const controle = store.get(item.id);
      controle.onsuccess = () => {
        if (controle.result) return;
        store.add({
          id: item.id,
          folderId: item.folderId,
          bestand: bestand,
          datum: item.datum,
          ...(item.verwijderdOp != null ? { verwijderdOp: item.verwijderdOp } : {})
        });
        toegevoegd = true;
      };

      tx.oncomplete = () => resolve(toegevoegd);
      tx.onerror = () => reject(tx.error);
      tx.onabort = () => reject(tx.error);
    });
  } finally {
    db.close();
  }
}

function bereidHerstelMappenVoor(backupMappen) {
  if (!Array.isArray(backupMappen)) throw new Error('Ongeldige mappen in back-up.');

  function samenvoegen(bestaande, opgeslagen) {
    const resultaat = bestaande.map(map => ({
      ...map,
      children: Array.isArray(map.children) ? [...map.children] : []
    }));

    for (const map of opgeslagen) {
      if (!map || typeof map.id !== 'string') {
        throw new Error('Ongeldige map in back-up.');
      }

      const index = resultaat.findIndex(huidig => huidig.id === map.id);
      if (index === -1) {
        resultaat.push({ ...map, children: samenvoegen([], map.children || []) });
      } else {
        resultaat[index].children = samenvoegen(resultaat[index].children, map.children || []);
      }
    }
    return resultaat;
  }

  return samenvoegen(data.folders, backupMappen);
}

function bereidHerstelNotitiesVoor(backupNotities) {
  if (!Array.isArray(backupNotities)) throw new Error('Ongeldige notities in back-up.');

  // Met id: vergelijk op id. Oude back-ups zonder id: vergelijk op inhoud.
  const zelfde = (a, b) => (a.id && b.id)
    ? a.id === b.id
    : a.title === b.title && a.body === b.body && a.date === b.date;

  const resultaat = [...data.notes];

  for (const note of backupNotities) {
    if (!note || typeof note !== 'object') throw new Error('Ongeldige notitie.');

    if (!resultaat.some(huidig => zelfde(huidig, note))) {
      resultaat.push({ ...note, id: note.id || nieuwId() });
    }
  }
  return resultaat;
}

async function herstelBackupVeilig(bestand) {
  if (!bestand) return;

  try {
    const backup = await leesBackupVoorHerstel(bestand);
    const nieuweMappen = bereidHerstelMappenVoor(backup.mappenEnNotities.folders);
    const nieuweNotities = bereidHerstelNotitiesVoor(backup.mappenEnNotities.notes);

    if (controleerHerstelKoppelingen(backup).ontbrekend > 0) {
      alert('Herstel geblokkeerd: sommige foto’s hebben geen geldige map.');
      return;
    }

    const ids = new Set();
    for (const item of backup.media) {
      if (ids.has(item.id)) throw new Error('Dubbele foto-ID in back-up.');
      ids.add(item.id);
    }

    const bestanden = [];
    for (const item of backup.media) {
      bestanden.push({ item, bestandMedia: await herstelMediaBestand(item) });
    }

    if (!confirm(
      'Back-up herstellen?\n\n' +
      'Bestaande herinneringen blijven behouden.\n' +
      'Ontbrekende herinneringen worden toegevoegd.'
    )) return;

    let toegevoegd = 0;
    for (const { item, bestandMedia } of bestanden) {
      if (await slaHersteldMediaOp(item, bestandMedia)) toegevoegd++;
    }

    const notitiesToegevoegd = nieuweNotities.length - data.notes.length;
    data.folders = nieuweMappen;
    data.notes = nieuweNotities;
    persist();
    renderFolders();

    alert(
      'Herstel afgerond!\n\n' +
      toegevoegd + ' mediabestanden toegevoegd.\n' +
      notitiesToegevoegd + ' notities toegevoegd.'
    );
  } catch (fout) {
    console.error(fout);
    alert('Herstel niet volledig uitgevoerd: ' + fout.message);
  }
}

/* ===================== Private (versleuteld met pincode) ===================== */
// De privénotities worden versleuteld (AES-GCM) met een sleutel die uit de
// pincode wordt afgeleid (PBKDF2). De pincode zelf wordt nergens opgeslagen.
const PRIVATE_KEY = 'memoaris-private-v1';
const POGINGEN_KEY = 'memoaris-private-pogingen';
const PBKDF2_RONDES = 600000;
const AUTO_SLOT_MS = 2 * 60 * 1000;

let privateSleutel = null; // bestaat alleen in het geheugen zolang Private open is
let privateNotities = [];
let privateTimer = null;
let privateUrls = [];
let privateKiestBestand = false; // fotokiezer of camera is open

function ruimPrivateUrlsOp() {
  privateUrls.forEach(url => URL.revokeObjectURL(url));
  privateUrls = [];
}

function el(tag, props = {}, ...kinderen) {
  const element = document.createElement(tag);
  Object.assign(element, props);
  element.append(...kinderen);
  return element;
}

function naarB64(buffer) {
  const bytes = new Uint8Array(buffer);
  let tekst = '';
  for (let i = 0; i < bytes.length; i += 0x8000) {
    tekst += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
  }
  return btoa(tekst);
}

function vanB64(b64) {
  const tekst = atob(b64);
  const bytes = new Uint8Array(tekst.length);
  for (let i = 0; i < tekst.length; i++) bytes[i] = tekst.charCodeAt(i);
  return bytes;
}

function leesPrivateKluis() {
  try {
    const kluis = JSON.parse(localStorage.getItem(PRIVATE_KEY));
    return kluis && kluis.versie === 1 ? kluis : null;
  } catch (e) {
    return null;
  }
}

async function maakSleutel(pin, salt, rondes) {
  const basis = await crypto.subtle.importKey(
    'raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt, iterations: rondes, hash: 'SHA-256' },
    basis,
    { name: 'AES-GCM', length: 256 },
    false,
    ['encrypt', 'decrypt']
  );
}

async function bewaarPrivate() {
  const kluis = leesPrivateKluis();
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const versleuteld = await crypto.subtle.encrypt(
    { name: 'AES-GCM', iv },
    privateSleutel,
    new TextEncoder().encode(JSON.stringify(privateNotities))
  );
  localStorage.setItem(PRIVATE_KEY, JSON.stringify({
    versie: 1,
    salt: kluis.salt,
    rondes: kluis.rondes,
    iv: naarB64(iv),
    ct: naarB64(versleuteld)
  }));
}

async function stelPinIn(pin) {
  // Eventuele oude, onleesbare privéfoto's opruimen.
  await metStore('privefotos', 'readwrite', s => s.clear());
  const salt = crypto.getRandomValues(new Uint8Array(16));
  privateSleutel = await maakSleutel(pin, salt, PBKDF2_RONDES);
  privateNotities = [];
  localStorage.setItem(PRIVATE_KEY, JSON.stringify({
    versie: 1, salt: naarB64(salt), rondes: PBKDF2_RONDES
  }));
  await bewaarPrivate();
}

// Geeft true als de pincode klopt. Een verkeerde code kan niet ontsleutelen.
async function ontgrendel(pin) {
  const kluis = leesPrivateKluis();
  const sleutel = await maakSleutel(pin, vanB64(kluis.salt), kluis.rondes);
  try {
    const leesbaar = await crypto.subtle.decrypt(
      { name: 'AES-GCM', iv: vanB64(kluis.iv) }, sleutel, vanB64(kluis.ct));
    privateNotities = JSON.parse(new TextDecoder().decode(leesbaar));
    privateSleutel = sleutel;
    return true;
  } catch (e) {
    return false;
  }
}

function vergrendelPrivate() {
  privateSleutel = null;
  privateNotities = [];
  clearTimeout(privateTimer);
  document.getElementById('priveViewer')?.remove();
  ruimPrivateUrlsOp();
}

/* Privéfoto's: elk bestand wordt apart versleuteld in IndexedDB bewaard. */
async function versleutelBestand(bestand) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt(
    { name: 'AES-GCM', iv }, privateSleutel, await bestand.arrayBuffer());
  return {
    id: crypto.randomUUID(),
    iv,
    ct,
    type: bestand.type,
    datum: new Date().toISOString()
  };
}

async function ontsleutelFoto(item, sleutel) {
  const data = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: item.iv }, sleutel, item.ct);
  return new Blob([data], { type: item.type });
}

function kiesPriveBestand(input) {
  privateKiestBestand = true;
  clearTimeout(privateTimer); // niet op slot gaan terwijl je een foto kiest
  input.click();
}

async function voegPrivefotosToe(event) {
  const bestanden = Array.from(event.target.files || []).filter(b =>
    b.type.startsWith('image/') || b.type.startsWith('video/'));
  event.target.value = '';
  privateKiestBestand = false;

  if (!privateSleutel) {
    alert('Private is vergrendeld. Ontgrendel en probeer het opnieuw.');
    renderPrivate();
    return;
  }
  startAutoSlot();

  let mislukt = 0;
  for (const bestand of bestanden) {
    try {
      const item = await versleutelBestand(bestand);
      await metStore('privefotos', 'readwrite', s => s.put(item));
    } catch (fout) {
      console.error(fout);
      mislukt++;
    }
  }

  if (mislukt) alert(mislukt + ' bestand(en) konden niet worden opgeslagen.');
  renderPrivate();
}

async function laadPrivefotos(galerij) {
  const sleutel = privateSleutel;

  let items;
  try {
    items = await metStore('privefotos', 'readonly', s => s.getAll());
  } catch (fout) {
    console.error(fout);
    galerij.textContent = 'Privéfoto’s laden is niet gelukt.';
    return;
  }

  if (privateSleutel !== sleutel || !galerij.isConnected) return;
  ruimPrivateUrlsOp();

  if (!items.length) {
    galerij.append(el('p', { className: 'muted', textContent: 'Nog geen privéfoto’s.' }));
    return;
  }

  items.sort((a, b) => b.datum.localeCompare(a.datum));

  for (const item of items) {
    let blob;
    try { blob = await ontsleutelFoto(item, sleutel); }
    catch (fout) { console.error(fout); continue; }

    // Intussen vergrendeld of scherm vernieuwd? Dan stoppen.
    if (privateSleutel !== sleutel || !galerij.isConnected) return;

    const url = URL.createObjectURL(blob);
    privateUrls.push(url);

    const isVideo = item.type.startsWith('video/');
    const element = el(isVideo ? 'video' : 'img', { src: url });
    if (isVideo) {
      element.muted = true;
      element.playsInline = true;
      element.preload = 'metadata';
    } else {
      element.alt = 'Privéfoto';
    }
    element.onclick = () => openPriveViewer(item, url, isVideo);
    galerij.append(element);
  }
}

function openPriveViewer(item, url, isVideo) {
  document.getElementById('priveViewer')?.remove();

  const viewer = el('div', { id: 'priveViewer' });
  viewer.style.cssText = `
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.95);
    z-index:9999;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
  `;

  const groot = el(isVideo ? 'video' : 'img', { src: url });
  groot.style.cssText = 'max-width:100%;max-height:80vh;object-fit:contain;';
  if (isVideo) {
    groot.controls = true;
    groot.playsInline = true;
    groot.onclick = e => e.stopPropagation();
  }

  const verwijder = el('button', { textContent: '🗑️ Definitief verwijderen' });
  verwijder.style.cssText = `
    position:absolute;
    bottom:35px;
    left:50%;
    transform:translateX(-50%);
    padding:12px 20px;
    border:0;
    border-radius:12px;
    background:#e53935;
    color:white;
    font-size:16px;
  `;
  verwijder.onclick = async e => {
    e.stopPropagation();
    if (!confirm('Deze privéfoto definitief verwijderen? Dit kan niet ongedaan worden gemaakt.')) return;
    try {
      await metStore('privefotos', 'readwrite', s => s.delete(item.id));
      viewer.remove();
      renderPrivate();
    } catch (fout) {
      console.error(fout);
      alert('Verwijderen is niet gelukt.');
    }
  };

  viewer.addEventListener('pointerdown', () => { if (privateSleutel) startAutoSlot(); });
  viewer.append(groot, verwijder);
  viewer.onclick = () => viewer.remove();
  document.body.append(viewer);
}

function vergrendelEnToon() {
  vergrendelPrivate();
  if (!document.getElementById('private').hidden) renderPrivate();
}

function startAutoSlot() {
  clearTimeout(privateTimer);
  privateTimer = setTimeout(vergrendelEnToon, AUTO_SLOT_MS);
}

// Wijzigt de notities en slaat versleuteld op; bij een fout terug naar de oude stand.
async function wijzigPrivate(wijziging) {
  const vorige = privateNotities;
  privateNotities = wijziging(privateNotities.map(n => ({ ...n })));
  try {
    await bewaarPrivate();
    return true;
  } catch (fout) {
    console.error(fout);
    privateNotities = vorige;
    alert('Opslaan is niet gelukt.');
    return false;
  }
}

/* Te veel foute pogingen: steeds langer wachten (blijft bewaard na herladen). */
function leesPogingen() {
  try {
    return JSON.parse(localStorage.getItem(POGINGEN_KEY)) || { aantal: 0, tot: 0 };
  } catch (e) {
    return { aantal: 0, tot: 0 };
  }
}

function registreerFout() {
  const pogingen = leesPogingen();
  pogingen.aantal++;
  if (pogingen.aantal >= 5) {
    pogingen.tot = Date.now() + Math.min(30000 * 2 ** (pogingen.aantal - 5), 3600000);
  }
  localStorage.setItem(POGINGEN_KEY, JSON.stringify(pogingen));
}

function resetPogingen() {
  localStorage.removeItem(POGINGEN_KEY);
}

function resterendeBlokkade() {
  return Math.max(0, leesPogingen().tot - Date.now());
}

function pinVeld(placeholder) {
  const veld = el('input', { type: 'password', placeholder, maxLength: 6, autocomplete: 'off' });
  veld.inputMode = 'numeric';
  veld.pattern = '[0-9]*';
  return veld;
}

/* Schermen */
function renderPrivate() {
  const doos = document.getElementById('privateInhoud');
  doos.replaceChildren();

  if (!window.crypto || !crypto.subtle) {
    doos.append(el('p', {
      className: 'waarschuwing',
      textContent: 'De privéruimte werkt alleen als de app via een https-adres geopend is.'
    }));
    return;
  }

  if (!leesPrivateKluis()) return toonPinInstellen(doos);
  if (!privateSleutel) return toonPinInvoer(doos);
  toonPrivateNotities(doos);
}

function toonPinInstellen(doos) {
  const pin1 = pinVeld('Kies een pincode van 6 cijfers');
  const pin2 = pinVeld('Herhaal je pincode');
  const melding = el('p', { className: 'muted' });
  const knop = el('button', { className: 'action', textContent: 'Pincode instellen' });

  knop.onclick = async () => {
    if (!/^\d{6}$/.test(pin1.value)) { melding.textContent = 'Gebruik precies 6 cijfers.'; return; }
    if (pin1.value !== pin2.value) { melding.textContent = 'De pincodes zijn niet gelijk.'; return; }

    knop.disabled = true;
    melding.textContent = 'Bezig met beveiligen…';
    try {
      await stelPinIn(pin1.value);
      resetPogingen();
      startAutoSlot();
      renderPrivate();
    } catch (fout) {
      console.error(fout);
      knop.disabled = false;
      melding.textContent = 'Instellen is niet gelukt.';
    }
  };

  doos.append(
    el('p', { textContent: 'Stel een pincode in voor je privéruimte. Alles wat je hier bewaart, wordt versleuteld met deze code.' }),
    el('p', { className: 'waarschuwing', textContent: 'Let op: vergeet je je pincode, dan kan niemand je privénotities terughalen.' }),
    pin1, pin2, knop, melding
  );
}

function toonPinInvoer(doos) {
  const pin = pinVeld('Pincode');
  const melding = el('p', { className: 'muted' });
  const knop = el('button', { className: 'action', textContent: 'Ontgrendelen' });

  const probeer = async () => {
    const wacht = resterendeBlokkade();
    if (wacht > 0) {
      melding.textContent = 'Te veel pogingen. Probeer het over ' + Math.ceil(wacht / 1000) + ' seconden opnieuw.';
      return;
    }
    if (!/^\d{6}$/.test(pin.value)) { melding.textContent = 'Vul je 6 cijfers in.'; return; }

    knop.disabled = true;
    melding.textContent = 'Controleren…';

    let gelukt = false;
    try { gelukt = await ontgrendel(pin.value); }
    catch (fout) { console.error(fout); }

    if (gelukt) {
      resetPogingen();
      startAutoSlot();
      renderPrivate();
      return;
    }

    registreerFout();
    pin.value = '';
    knop.disabled = false;
    const nieuweWacht = resterendeBlokkade();
    melding.textContent = nieuweWacht > 0
      ? 'Onjuiste pincode. Wacht ' + Math.ceil(nieuweWacht / 1000) + ' seconden.'
      : 'Onjuiste pincode.';
  };

  knop.onclick = probeer;
  pin.onkeydown = e => { if (e.key === 'Enter') probeer(); };

  const vergeten = el('button', { className: 'back', textContent: 'Pincode vergeten?' });
  vergeten.onclick = async () => {
    if (!confirm(
      'Zonder je pincode kunnen je privénotities en privéfoto’s niet worden teruggehaald.\n\n' +
      'Wil je de privéruimte leegmaken en een nieuwe pincode instellen? ' +
      'Alles in Private wordt dan definitief verwijderd.'
    )) return;
    if (prompt('Typ WISSEN om te bevestigen.') !== 'WISSEN') return;
    try {
      await metStore('privefotos', 'readwrite', s => s.clear());
    } catch (fout) {
      console.error(fout);
      alert('Wissen is niet gelukt.');
      return;
    }
    localStorage.removeItem(PRIVATE_KEY);
    resetPogingen();
    renderPrivate();
  };

  doos.append(
    el('p', { textContent: 'Voer je pincode in om je privéruimte te openen.' }),
    pin, knop, melding, vergeten
  );
  setTimeout(() => pin.focus(), 50);
}

function toonPrivateNotities(doos) {
  const slot = el('button', { className: 'action', textContent: '🔒 Vergrendelen' });
  slot.onclick = vergrendelEnToon;

  const titel = el('input', { placeholder: 'Titel' });
  const tekst = el('textarea', { placeholder: 'Schrijf hier iets privés...' });
  const opslaan = el('button', { className: 'action', textContent: 'Privé bewaren' });

  opslaan.onclick = async () => {
    const t = titel.value.trim();
    const b = tekst.value.trim();
    if (!t && !b) { alert('Schrijf eerst iets.'); return; }

    const nieuw = {
      id: nieuwId(),
      title: t || 'Zonder titel',
      body: b,
      date: new Date().toLocaleDateString('nl-NL')
    };
    if (await wijzigPrivate(lijst => [nieuw, ...lijst])) renderPrivate();
  };

  const lijst = el('div');
  if (!privateNotities.length) {
    lijst.append(el('p', { className: 'muted', textContent: 'Nog geen privénotities.' }));
  }

  privateNotities.forEach(note => {
    const bewerken = el('button', { textContent: '✏️ Bewerken' });
    bewerken.onclick = async () => {
      const nieuweTitel = prompt('Nieuwe titel:', note.title);
      if (nieuweTitel === null) return;
      const nieuweTekst = prompt('Nieuwe tekst:', note.body || '');
      if (nieuweTekst === null) return;
      const ok = await wijzigPrivate(l => l.map(n => n.id === note.id
        ? { ...n, title: nieuweTitel.trim() || 'Zonder titel', body: nieuweTekst }
        : n));
      if (ok) renderPrivate();
    };

    const verwijderen = el('button', { textContent: '🗑️ Verwijderen' });
    verwijderen.onclick = async () => {
      if (!confirm('Deze privénotitie definitief verwijderen?')) return;
      if (await wijzigPrivate(l => l.filter(n => n.id !== note.id))) renderPrivate();
    };

    const inhoud = el('div', { textContent: note.body || '' });
    inhoud.style.whiteSpace = 'pre-wrap';

    lijst.append(el('div', { className: 'notitiekaart' },
      el('h3', { textContent: note.title }),
      el('p', { className: 'muted', textContent: note.date || '' }),
      inhoud,
      bewerken,
      verwijderen
    ));
  });

  // Privéfoto's
  const galerijInput = el('input', { type: 'file', accept: 'image/*,video/*', multiple: true, hidden: true });
  galerijInput.onchange = voegPrivefotosToe;

  const cameraInput = el('input', { type: 'file', accept: 'image/*', hidden: true });
  cameraInput.setAttribute('capture', 'environment');
  cameraInput.onchange = voegPrivefotosToe;

  const fotoKnop = el('button', { textContent: '🖼️ Foto’s toevoegen' });
  fotoKnop.onclick = () => kiesPriveBestand(galerijInput);
  const cameraKnop = el('button', { textContent: '📷 Camera' });
  cameraKnop.onclick = () => kiesPriveBestand(cameraInput);

  const galerij = el('div', { className: 'privegalerij' });

  doos.append(
    el('p', { className: 'muted', textContent: 'Ontgrendeld. Vergrendelt automatisch na 2 minuten zonder activiteit.' }),
    slot,
    el('h3', { textContent: '🖼️ Privéfoto’s' }),
    el('div', { className: 'mediaknoppen' }, fotoKnop, cameraKnop, galerijInput, cameraInput),
    galerij,
    el('h3', { textContent: '📝 Privénotities' }),
    titel, tekst, opslaan, lijst
  );

  laadPrivefotos(galerij);
}

// Elke aanraking of toetsaanslag in Private houdt hem langer open.
['pointerdown', 'keydown'].forEach(soort => {
  document.getElementById('private').addEventListener(soort, () => {
    if (privateSleutel) startAutoSlot();
  });
});

// Ga je naar een andere app of vergrendel je je telefoon, dan gaat Private op slot.
// Uitzondering: tijdens het kiezen van een foto of het gebruik van de camera.
document.addEventListener('visibilitychange', () => {
  if (document.hidden && privateSleutel && !privateKiestBestand) vergrendelEnToon();
});

// Fotokiezer geannuleerd: de gewone beveiliging weer aanzetten.
window.addEventListener('focus', () => {
  if (!privateKiestBestand) return;
  setTimeout(() => {
    if (privateKiestBestand) {
      privateKiestBestand = false;
      if (privateSleutel) startAutoSlot();
    }
  }, 1500);
});

/* ===================== Opstarten ===================== */
// Vraag de browser om de opslag niet automatisch te wissen.
if (navigator.storage && navigator.storage.persist) {
  navigator.storage.persist().catch(() => {});
}

// Ruim verlopen prullenbak-items op bij het openen van de app.
ruimPrullenbakOp().catch(fout => console.error('Prullenbak opruimen mislukt:', fout));
</script>
